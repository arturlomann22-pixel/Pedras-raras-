/* -------------------------------- Reveal on scroll ---------------------- */
function useReveal() {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setVisible(true);
          obs.disconnect();
        }
      },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ children, delay = 0, className = "", style = {} }) {
  const [ref, visible] = useReveal();
  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: visible ? 1 : 0,
        transform: visible ? "translateY(0)" : "translateY(18px)",
        transition: `opacity 0.7s ease ${delay}ms, transform 0.7s ease ${delay}ms`,
        ...style,
      }}
    >
      {children}
    </div>
  );
}

/* ============================= MOBILE STICKY BAR ============================= */
function MobileCta() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => setShow(window.scrollY > window.innerHeight * 0.8);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <div
      className="sm:hidden fixed bottom-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-3"
      style={{
        background: "rgba(10,12,11,0.95)",
        borderTop: "1px solid var(--border)",
        backdropFilter: "blur(10px)",
        transform: show ? "translateY(0)" : "translateY(100%)",
        transition: "transform 0.3s ease",
      }}
    >
      <div>
        <p className="text-xs font-semibold" style={{ color: "var(--white)" }}>
          {PRODUCT_NAME}
        </p>
        <p className="text-xs" style={{ color: "var(--gold-light)" }}>
          {OFFER_PRICE}
        </p>
      </div>
      <button
        onClick={goToCheckout}
        className="rounded-full px-4 py-2 text-xs font-semibold"
        style={{ background: "var(--gold)", color: "#161307" }}
      >
        Quero o guia
      </button>
    </div>
  );
}
